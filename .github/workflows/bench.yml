name: bench
on:
  push:
    branches: [main]
  pull_request: # compared with the last main run, so a PR shows any instruction-count rise
  workflow_dispatch:
permissions:
  contents: read
  actions: read # to download the previous run's counts
jobs:
  instructions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: ./scripts/build.sh --march x86-64-v3 # valgrind can't run AVX-512, which native may pick
      - run: ./scripts/gen_corpus.sh 100000 # counts are per number, so a small corpus is enough
      - run: ./scripts/fetch_binance.sh # binance + binance_trades corpora
      - name: Download the last main run's counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -w bench.yml -b main -s success -L 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$id" ]; then gh run download "$id" -n instructions -D prev || true; fi
      - run: ./scripts/count_instr.sh prev/instructions.tsv >instructions.tsv
      - run: |
          awk -F'\t' 'BEGIN { print "| parser | corpus | instructions/number |\n|---|---|--:|" }
                      { print "| " $1 " | " $2 " | " $3 " |" }' instructions.tsv >>"$GITHUB_STEP_SUMMARY"
      - name: Speed relative to naive (same runner, so its speed cancels out)
        run: |
          build/bench list | while read -r parser corpus; do
            build/bench "$parser" "data/$corpus.txt" throughput
          done | jq -s -r '
            (map(select(.parser == "fp_u64_naive") | {(.corpus): .mnum_per_s}) | add) as $naive
            | "| parser | corpus | Mnum/s | vs naive |", "|---|---|--:|--:|",
              (.[] | "| \(.parser) | \(.corpus) | \(.mnum_per_s) | \(if $naive[.corpus]
                then "\((.mnum_per_s / $naive[.corpus] * 100 | round) / 100)x" else "-" end) |")
          ' >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: instructions
          path: instructions.tsv
